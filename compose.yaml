services:
  tenant-postgres:
    image: 'postgres:16-alpine'
    container_name: erp-tenant-postgres
    environment:
      - POSTGRES_DB=erp_tenant_db
      - POSTGRES_USER=tenant_user
      - POSTGRES_PASSWORD=${SPRING_FLYWAY_PASSWORD:?defina SPRING_FLYWAY_PASSWORD con la contrasena del rol propietario}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_tenant_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tenant_user -d erp_tenant_db']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_tenant_data:
