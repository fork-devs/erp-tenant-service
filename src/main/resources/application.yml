server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /

spring:
  application:
    name: erp-tenant-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/erp_tenant_db}
    # Rol de EJECUCION: sin privilegios de propietario, con NOBYPASSRLS.
    username: ${ERP_APP_DB_USER:erp_app}
    password: ${ERP_APP_DB_PASSWORD:erp_app_local_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: TenantHikariPool
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    # El servicio es dueno de su esquema: marcar como baseline una base ya
    # existente haria que las migraciones no se ejecutaran.
    baseline-on-migrate: false
    # Rol de MIGRACION: el propietario, que necesita permisos de DDL.
    user: ${SPRING_FLYWAY_USER:tenant_user}
    password: ${SPRING_FLYWAY_PASSWORD:tenant_secret}
    placeholders:
      appRolePassword: ${ERP_APP_DB_PASSWORD:erp_app_local_password}

erp:
  security:
    # Conjunto de claves publicas del emisor de credenciales. Fuera del
    # entorno local debe ser https: la sustitucion de claves por un
    # intermediario seria posible en claro.
    jwks-url: ${JWKS_URL:http://localhost:8081/.well-known/jwks.json}
  tenant:
    outbox:
      relay-enabled: ${OUTBOX_RELAY_ENABLED:true}
      interval-ms: ${OUTBOX_RELAY_INTERVAL_MS:5000}
      batch-size: 50
      # Numero maximo de intentos antes de que un mensaje pase a la cola de
      # muertos. Con la escala de esperas (5s, 30s, 5m, 30m, 2h, 8h, 24h),
      # siete intentos cubren la ventana de recuperacion de 24 horas.
      max-attempts: ${OUTBOX_MAX_ATTEMPTS:7}
      # Espera maxima entre reintentos.
      max-delay: ${OUTBOX_MAX_DELAY:PT24H}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.erp.tenant: DEBUG
