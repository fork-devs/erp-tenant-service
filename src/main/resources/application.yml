server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /

spring:
  application:
    name: erp-tenant-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/erp_tenant_db}
    username: ${SPRING_DATASOURCE_USERNAME:tenant_user}
    password: ${SPRING_DATASOURCE_PASSWORD:tenant_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: TenantHikariPool
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

erp:
  tenant:
    outbox:
      relay-enabled: ${OUTBOX_RELAY_ENABLED:true}
      interval-ms: ${OUTBOX_RELAY_INTERVAL_MS:5000}
      batch-size: 50

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.erp.tenant: DEBUG
