spring:
  application:
    name: erp-tenant-service-test
  # El perfil de test NO define datasource: la configuracion de la base de
  # datos la inyecta AbstractPostgresIntegrationTest, que arranca una
  # instancia real de PostgreSQL en proceso.
  #
  # Antes se usaba H2 con ddl-auto: create-drop y Flyway desactivado, con lo
  # que el esquema de produccion nunca se ejecutaba y la restriccion NOT NULL
  # de tenant_outbox.tenant_id no llegaba a aplicarse.
  jpa:
    show-sql: false
  flyway:
    enabled: true

erp:
  tenant:
    outbox:
      relay-enabled: false
      interval-ms: 5000
      batch-size: 50
