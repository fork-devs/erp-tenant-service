spring:
  application:
    name: erp-tenant-service-test
  datasource:
    url: jdbc:h2:mem:tenant_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

erp:
  tenant:
    outbox:
      relay-enabled: false
      interval-ms: 60000
      batch-size: 10
